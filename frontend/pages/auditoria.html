<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria - Sistema de Calificaciones</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .audit-stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .audit-stat {
      background: white; border-radius: 10px; padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-width: 140px; text-align: center;
    }
    .audit-stat .num { font-size: 1.8rem; font-weight: 700; }
    .audit-stat .lbl { font-size: 0.78rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.2rem; }
    .audit-stat.total .num { color: #1e3a8a; }
    .audit-stat.inserts .num { color: #16a34a; }
    .audit-stat.updates .num { color: #d97706; }
    .audit-stat.deletes .num { color: #dc2626; }

    .audit-card {
      background: white; border-radius: 12px; padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 0.7rem;
      border-left: 4px solid #d1d5db; transition: background 0.15s;
    }
    .audit-card:hover { background: #f9fafb; }
    .audit-card.INSERT { border-left-color: #22c55e; }
    .audit-card.UPDATE { border-left-color: #f59e0b; }
    .audit-card.DELETE { border-left-color: #ef4444; }

    .audit-header {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      cursor: pointer; user-select: none;
    }
    .audit-header .fecha { font-size: 0.82rem; color: #6b7280; }
    .audit-header .tabla { font-weight: 600; color: #1f2937; }
    .audit-op {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 6px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .audit-op.INSERT { background: #dcfce7; color: #166534; }
    .audit-op.UPDATE { background: #fef3c7; color: #92400e; }
    .audit-op.DELETE { background: #fee2e2; color: #991b1b; }
    .audit-header .usuario { font-size: 0.82rem; color: #6b7280; margin-left: auto; }
    .audit-header .arrow { transition: transform 0.2s; font-size: 0.8rem; color: #9ca3af; }
    .audit-card.abierto .audit-header .arrow { transform: rotate(90deg); }

    .audit-body { display: none; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid #f3f4f6; }
    .audit-card.abierto .audit-body { display: block; }
    .audit-json {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    }
    .audit-json-block h4 { font-size: 0.78rem; color: #6b7280; text-transform: uppercase; margin-bottom: 0.4rem; }
    .audit-json pre {
      background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 0.6rem 0.8rem; font-size: 0.78rem; overflow-x: auto;
      max-height: 200px; overflow-y: auto; color: #374151;
    }
    .audit-json .empty { color: #9ca3af; font-style: italic; font-size: 0.85rem; }

    .audit-filters { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .audit-filters select, .audit-filters input[type="date"] {
      padding: 0.4rem 0.7rem; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 0.85rem; background: white;
    }
    .audit-filters label { font-size: 0.85rem; font-weight: 600; color: #374151; }
    /* .pagination vive en css/style.css (compartido, Fase 4) */

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .cat-card {
      background: white; border-radius: 12px; padding: 1.1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer;
      border: 1px solid #e5e7eb; transition: transform 0.12s, box-shadow 0.12s;
    }
    .cat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(30,58,138,0.12); }
    .cat-card h3 { font-size: 0.95rem; color: #1e3a8a; margin-bottom: 0.4rem; }
    .cat-card .total { font-size: 1.6rem; font-weight: 700; color: #111827; }
    .cat-card .meta { font-size: 0.78rem; color: #6b7280; margin-top: 0.3rem; }
    .cat-card .hoy { display: inline-block; margin-top: 0.5rem; font-size: 0.72rem; font-weight: 700;
      padding: 0.15rem 0.55rem; border-radius: 6px; background: #f3f4f6; color: #6b7280; }
    .cat-card .hoy.activa { background: #dcfce7; color: #166534; }

    @media (max-width: 768px) {
      .audit-json { grid-template-columns: 1fr; }
      .audit-header { gap: 0.4rem; }
      .audit-header .usuario { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="layout">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="topbar-wrapper">
    <header class="topbar" id="app-topbar"></header>
    <main class="main-content">
    <h1>Auditoria del Sistema</h1>
    <p class="alert alert-error" id="error" style="display:none"></p>

    <!-- Nivel 1: bloques por categoria -->
    <div id="vista-resumen">
      <div class="cat-grid" id="resumen-cats"></div>
    </div>

    <!-- Nivel 2: detalle paginado de una categoria -->
    <div id="vista-detalle" style="display:none">
      <button class="btn-secondary" id="btn-volver" style="margin-bottom:1rem;">&larr; Volver al resumen</button>
      <h2 id="detalle-titulo" style="font-size:1.05rem;color:#1e3a8a;margin-bottom:1rem;"></h2>
      <div class="audit-stats" id="stats"></div>
      <div class="audit-filters">
        <label for="filter-tabla">Tabla:</label>
        <select id="filter-tabla"><option value="">Todas</option></select>
        <label for="filter-desde">Desde:</label>
        <input type="date" id="filter-desde">
        <label for="filter-hasta">Hasta:</label>
        <input type="date" id="filter-hasta">
        <button class="btn-primary btn-sm" id="btn-filtrar">Filtrar</button>
        <button class="btn-secondary btn-sm" id="btn-limpiar">Limpiar</button>
      </div>
      <div id="resultado"><p>Cargando...</p></div>
      <div class="pagination" id="paginacion"></div>
    </div>
    </main>
  </div>
</div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pagination.js"></script>
  <script>
    let state = { page: 1, categoria: '', tabla: '', desde: '', hasta: '' };

    const NOMBRES_CATEGORIA = {
      calificaciones: 'Calificaciones',
      matriculas_estudiantes: 'Matrículas y estudiantes',
      materias_asignaciones: 'Materias y asignaciones',
      periodos_catalogos: 'Periodos y catálogos',
      usuarios_accesos: 'Usuarios y accesos',
      otros: 'Otros'
    };
    const nombreCat = (c) => NOMBRES_CATEGORIA[c] || c;

    function formatearJson(datos) {
      if (!datos) return '<span class="empty">Sin datos</span>';
      try {
        const obj = typeof datos === 'string' ? JSON.parse(datos) : datos;
        const limpio = {};
        for (const [k, v] of Object.entries(obj)) {
          if (k === 'password_hash') continue;
          limpio[k] = v;
        }
        return '<pre>' + esc(JSON.stringify(limpio, null, 2)) + '</pre>';
      } catch { return '<pre>' + esc(String(datos)) + '</pre>'; }
    }

    async function cargarResumen() {
      const { resumen } = await apiGet('/auditoria/resumen');
      const div = document.getElementById('resumen-cats');
      if (!resumen || resumen.length === 0) {
        div.innerHTML = '<p>No hay eventos de auditoria registrados.</p>';
        return;
      }
      div.innerHTML = resumen.map(r => {
        const ultimo = r.ultimo_evento ? new Date(r.ultimo_evento).toLocaleString('es-EC') : '—';
        return `<div class="cat-card" onclick="entrarCategoria('${esc(r.categoria)}')">
          <h3>${esc(nombreCat(r.categoria))}</h3>
          <div class="total">${r.total_eventos}</div>
          <div class="meta">Último evento: ${ultimo}</div>
          <span class="hoy ${r.eventos_hoy > 0 ? 'activa' : ''}">${r.eventos_hoy > 0 ? r.eventos_hoy + ' hoy' : 'sin actividad hoy'}</span>
        </div>`;
      }).join('');
    }

    function entrarCategoria(categoria) {
      state = { page: 1, categoria, tabla: '', desde: '', hasta: '' };
      document.getElementById('filter-tabla').value = '';
      document.getElementById('filter-desde').value = '';
      document.getElementById('filter-hasta').value = '';
      document.getElementById('vista-resumen').style.display = 'none';
      document.getElementById('vista-detalle').style.display = 'block';
      document.getElementById('detalle-titulo').textContent = nombreCat(categoria);
      cargarAuditoria(1).catch(showError);
    }

    function volverResumen() {
      document.getElementById('vista-detalle').style.display = 'none';
      document.getElementById('vista-resumen').style.display = 'block';
      cargarResumen().catch(showError);
    }

    async function cargarAuditoria(page) {
      state.page = page || 1;
      let url = `/auditoria/?page=${state.page}&limit=50`;
      if (state.categoria) url += `&categoria=${encodeURIComponent(state.categoria)}`;
      if (state.tabla) url += `&tabla=${encodeURIComponent(state.tabla)}`;
      if (state.desde) url += `&desde=${encodeURIComponent(state.desde)}`;
      if (state.hasta) url += `&hasta=${encodeURIComponent(state.hasta)}`;
      const { datos: registros, paginacion } = await apiGet(url);

      const total = paginacion.total;
      const inserts = registros.filter(r => r.operacion === 'INSERT').length;
      const updates = registros.filter(r => r.operacion === 'UPDATE').length;
      const deletes = registros.filter(r => r.operacion === 'DELETE').length;

      document.getElementById('stats').innerHTML = `
        <div class="audit-stat total"><div class="num">${total}</div><div class="lbl">Total</div></div>
        <div class="audit-stat inserts"><div class="num">${inserts}</div><div class="lbl">En esta pagina</div></div>
        <div class="audit-stat updates"><div class="num">${updates}</div><div class="lbl">Actualizaciones</div></div>
        <div class="audit-stat deletes"><div class="num">${deletes}</div><div class="lbl">Eliminaciones</div></div>`;

      const div = document.getElementById('resultado');
      if (registros.length === 0) { div.innerHTML = '<p>No hay registros de auditoria para esta consulta.</p>'; document.getElementById('paginacion').innerHTML = ''; return; }

      div.innerHTML = registros.map((r, i) => {
        const fecha = new Date(r.fecha_evento).toLocaleString('es-EC');
        const usuario = r.usuario_nombres ? esc(r.usuario_nombres + ' ' + r.usuario_apellidos) : '—';
        return `<div class="audit-card ${r.operacion}" id="audit-${i}">
          <div class="audit-header" onclick="document.getElementById('audit-${i}').classList.toggle('abierto')">
            <span class="audit-op ${r.operacion}">${r.operacion}</span>
            <span class="tabla">${esc(r.tabla_afectada)}</span>
            <span class="fecha">${fecha}</span>
            <span class="usuario">${usuario}</span>
            <span class="arrow">&#9654;</span>
          </div>
          <div class="audit-body">
            <div class="audit-json">
              <div class="audit-json-block">
                <h4>Datos anteriores</h4>
                ${formatearJson(r.datos_anteriores)}
              </div>
              <div class="audit-json-block">
                <h4>Datos nuevos</h4>
                ${formatearJson(r.datos_nuevos)}
              </div>
            </div>
          </div>
        </div>`;
      }).join('');

      renderPaginacion('paginacion', paginacion, (p) => cargarAuditoria(p).catch(showError));
    }

    (async () => {
      if (!await initPage({ adminOnly: true })) return;
      try {
        const sel = document.getElementById('filter-tabla');
        const tablasConocidas = ['calificaciones', 'periodos_academicos', 'materias', 'estudiantes', 'usuarios', 'profesores', 'representantes', 'matriculas', 'tipos_evaluacion', 'profesor_materia_periodo', 'ciclos_evaluativos', 'parciales', 'cursos'];
        tablasConocidas.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t; opt.textContent = t;
          sel.appendChild(opt);
        });
        document.getElementById('btn-volver').onclick = volverResumen;
        document.getElementById('btn-filtrar').onclick = () => {
          state.tabla = sel.value;
          state.desde = document.getElementById('filter-desde').value;
          state.hasta = document.getElementById('filter-hasta').value;
          cargarAuditoria(1).catch(showError);
        };
        document.getElementById('btn-limpiar').onclick = () => {
          sel.value = '';
          document.getElementById('filter-desde').value = '';
          document.getElementById('filter-hasta').value = '';
          state.tabla = ''; state.desde = ''; state.hasta = '';
          cargarAuditoria(1).catch(showError);
        };
        await cargarResumen();
      } catch (err) { showError(err.message); }
    })();
  </script>
</body>
</html>
