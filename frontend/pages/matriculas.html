<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriculas - Sistema de Calificaciones</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="layout">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="topbar-wrapper">
    <header class="topbar" id="app-topbar"></header>
    <main class="main-content">
    <h1>Matriculas</h1>
    <p class="alert alert-error" id="error" style="display:none"></p>
    <p class="alert-exito" id="ok" style="display:none"></p>

    <div class="form-box">
      <label for="sel-periodo">Periodo</label>
      <select id="sel-periodo"></select>
    </div>

    <p style="font-size:0.88rem;color:#6b7280;margin-bottom:1.2rem;max-width:760px;">
      La matrícula es <strong>ciega</strong>: la familia se preinscribe sola y
      el admin solo <strong>aprueba o rechaza</strong> desde la bandeja.
      No hay matrícula manual.
    </p>

    <div class="mat-form-card" id="bandeja-sol">
      <h3>Solicitudes de preinscripción pendientes <span id="sol-count" class="badge"></span></h3>
      <div class="search-bar">
        <input type="text" id="busqueda-sol" placeholder="Buscar por cédula, aspirante o acudiente...">
        <button class="btn-secondary btn-sm" id="btn-buscar-sol">Buscar</button>
      </div>
      <div id="lista-sol"></div>
    </div>

    <div class="search-bar">
      <input type="text" id="busqueda" placeholder="Buscar por nombre, apellido o cedula...">
      <button class="btn-primary btn-sm" id="btn-buscar">Buscar</button>
    </div>

    <p class="mat-count" id="contador"></p>
    <div id="lista"></div>
    <div class="pagination" id="paginacion"></div>
    </main>
  </div>
</div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/skeleton.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pagination.js"></script>
  <script>
    let periodoId = '';
    let page = 1;

    async function cargarPeriodos() {
      const per = await apiGet('/periodos/');
      const sel = document.getElementById('sel-periodo');
      sel.innerHTML = (per.periodos || []).map(p => `<option value="${p.id_periodo}">${esc(p.nombre)}</option>`).join('');
      periodoId = await periodoPagina(per);
      sel.value = periodoId;
    }

    async function cargarOpciones() {
      // Sin matrícula manual (M9): no hay selects que llenar.
      return;
    }

    async function cargarSolicitudes() {
      try {
        const q = (document.getElementById('busqueda-sol').value || '').trim();
        let url = '/preinscripciones/?estado=pendiente&page=1&limit=20';
        if (q) url += `&q=${encodeURIComponent(q)}`;
        const d = await apiGet(url);
        const arr = d.datos || [];
        document.getElementById('sol-count').textContent = d.paginacion?.total || 0;
        const div = document.getElementById('lista-sol');
        if (arr.length === 0) { div.innerHTML = '<p style="font-size:0.85rem;color:#6b7280;">Sin solicitudes pendientes.</p>'; return; }
        div.innerHTML = `<div class="table-responsive"><table><thead><tr>
          <th>Aspirante</th><th>Cédula</th><th>Tipo</th><th>Acudiente</th><th>Parentesco</th><th>Curso</th><th></th></tr></thead><tbody>` +
          arr.map(s => `<tr><td>${esc(s.nombres)} ${esc(s.apellidos)}</td><td>${esc(s.cedula)}</td>
            <td>${s.tipo === 'rematricula' ? '<span class="pill pill-info">rematricula</span>' : '<span class="pill pill-muted">nuevo</span>'}</td>
            <td>${esc(s.rep_nombres)} ${esc(s.rep_apellidos)}${s.rep_documento ? '<br><span style="font-size:0.78rem;color:#6b7280;">Doc: ' + esc(s.rep_documento) + '</span>' : ''}</td>
            <td>${esc(s.rep_parentesco || '—')}</td>
            <td>${s.curso_nombre ? esc(s.curso_nombre) + ' ' + esc(s.paralelo || '') : '—'}</td>
            <td class="td-actions" style="display:flex;gap:0.4rem;">
              <button class="btn-primary btn-sm" data-aprobar="${s.id_solicitud}">Aprobar</button>
              <button class="btn-secondary btn-sm btn-danger-text" data-rechazar="${s.id_solicitud}">Rechazar</button>
            </td></tr>`).join('') + '</tbody></table></div>';
        div.querySelectorAll('[data-aprobar]').forEach(b => b.onclick = async () => {
          if (!confirm('¿Aprobar y matricular en el curso elegido?')) return;
          try {
            const r = await apiPost(`/preinscripciones/${b.dataset.aprobar}/aprobar`, {});
            showOk(r.password ? `${r.mensaje} Usuario: ${r.email} / ${r.password}` : `${r.mensaje} (${r.email})`);
            await cargarSolicitudes();
            await cargarLista(1);
          } catch (err) { showError(err.message); }
        });
        div.querySelectorAll('[data-rechazar]').forEach(b => b.onclick = async () => {
          const motivoRaw = prompt('Motivo del rechazo (opcional):');
          if (motivoRaw === null) return;
          try {
            await apiPost(`/preinscripciones/${b.dataset.rechazar}/rechazar`, { motivo: motivoRaw });
            showOk('Solicitud rechazada.');
            await cargarSolicitudes();
          } catch (err) { showError(err.message); }
        });
      } catch (err) { showError(err.message); }
    }

    async function cargarLista(p) {
      page = p || 1;
      const q = document.getElementById('busqueda').value.trim();
      let url = `/matriculas/?id_periodo=${encodeURIComponent(periodoId)}&page=${page}&limit=15`;
      if (q) url += `&q=${encodeURIComponent(q)}`;
      const d = await apiGet(url);
      const div = document.getElementById('lista');
      document.getElementById('contador').textContent = `${d.paginacion?.total || 0} estudiante(s) matriculado(s)`;

      if (!d.datos || d.datos.length === 0) {
        div.innerHTML = '<p>No hay estudiantes matriculados en este periodo.</p>';
        renderPaginacion('paginacion', d.paginacion, () => {});
        return;
      }

      div.innerHTML = `<div class="table-responsive"><table><thead><tr>
        <th>Cedula</th><th>Nombres</th><th>Apellidos</th><th>Curso</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>` +
        d.datos.map(e => `<tr>
          <td>${esc(e.cedula)}</td>
          <td>${esc(e.nombres)}</td>
          <td>${esc(e.apellidos)}</td>
          <td>${e.curso_nombre ? esc(e.curso_nombre) + ' ' + esc(e.paralelo || '') : '<em style="color:#9ca3af;">Sin curso</em>'}</td>
          <td>${e.activo ? '<span style="color:#16a34a;font-weight:600;">Activo</span>' : '<span style="color:#dc2626;font-weight:600;">Inactivo</span>'}</td>
          <td class="td-actions">
            <button class="btn-delete btn-sm" data-id="${e.id_matricula}" data-nom="${esc(e.nombres)} ${esc(e.apellidos)}">Desmatricular</button>
          </td>
        </tr>`).join('') + '</tbody></table></div>';

      renderPaginacion('paginacion', d.paginacion, (p) => cargarLista(p).catch(showError));

      div.querySelectorAll('[data-id]').forEach(b => {
        b.onclick = async () => {
          if (!confirm(`Desmatricular a ${b.dataset.nom}?`)) return;
          try {
            await apiDelete('/matriculas/' + b.dataset.id);
            cargarLista(page).catch(showError);
            cargarOpciones().catch(showError);
          } catch (err) { showError(err.message); }
        };
      });
    }

    (async () => {
      if (!await initPage({ adminOnly: true })) return;
      try {
        await cargarPeriodos();
        await Promise.all([cargarOpciones(), cargarLista(1), cargarSolicitudes()]);
        document.getElementById('sel-periodo').onchange = async () => {
          periodoId = document.getElementById('sel-periodo').value;
          await Promise.all([cargarOpciones(), cargarLista(1)]);
        };
        document.getElementById('btn-buscar').onclick = () => cargarLista(1).catch(showError);
        document.getElementById('busqueda').onkeydown = (e) => { if (e.key === 'Enter') cargarLista(1).catch(showError); };
        document.getElementById('btn-buscar-sol').onclick = () => cargarSolicitudes().catch(showError);
        document.getElementById('busqueda-sol').onkeydown = (e) => { if (e.key === 'Enter') cargarSolicitudes().catch(showError); };
      } catch (err) { showError(err.message); }
    })();
  </script>
</body>
</html>
