<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta - Sistema de Calificaciones</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .mat-card {
      background: white; border-radius: 12px; padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 0.9rem;
      border-left: 4px solid #2563eb;
    }
    .mat-card.sin-notas { border-left-color: #d1d5db; }
    .mat-top { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .mat-nombre { font-weight: 700; font-size: 1rem; color: #1f2937; flex: 1; min-width: 160px; }
    .mat-prom { font-size: 1.7rem; font-weight: 800; color: #1e3a8a; }
    .mat-prom.na { font-size: 1rem; font-weight: 600; color: #9ca3af; }
    .mat-escala { font-size: 0.78rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 6px; background: #eff6ff; color: #1e40af; }
    .mat-escala.na { background: #f3f4f6; color: #6b7280; }
    .mat-detalle { margin-top: 0.8rem; border-top: 1px solid #f3f4f6; padding-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="layout">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="topbar-wrapper">
    <header class="topbar" id="app-topbar"></header>
    <main class="main-content">
    <h1>Consulta de Calificaciones</h1>
    <p class="periodo-fijo" id="info-periodo"></p>
    <p class="alert alert-error" id="error" style="display:none"></p>
    <div class="form-box">
      <label for="sel-periodo">Periodo</label>
      <select id="sel-periodo"></select>
      <label for="sel-est">Estudiante</label>
      <select id="sel-est"><option value="">-- Selecciona un estudiante --</option></select>
      <label for="sel-mat" id="lbl-mat" style="display:none">Materia (ver promedio específico)</label>
      <select id="sel-mat" style="display:none"><option value="">-- Todas las materias --</option></select>
    </div>
    <div id="resultado"></div>
    <div id="desglose"></div>
    </main>
  </div>
</div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    function q() {
      const p = new URLSearchParams();
      if (document.getElementById('sel-periodo').value) p.set('id_periodo', document.getElementById('sel-periodo').value);
      if (document.getElementById('sel-est').value) p.set('id_estudiante', document.getElementById('sel-est').value);
      if (document.getElementById('sel-mat').value) p.set('id_materia', document.getElementById('sel-mat').value);
      return p.toString();
    }
    async function cargar(rebuild = false) {
      const d = await apiGet('/consulta/?' + q());
      document.getElementById('info-periodo').innerHTML =
        `Periodo seleccionado: <strong>${esc(d.periodoNombre || d.periodoActivo?.nombre || '—')}</strong>`;
      if (rebuild || !document.getElementById('sel-periodo').options.length) {
        document.getElementById('sel-periodo').innerHTML =
          d.periodos.map(p => `<option value="${p.id_periodo}" ${String(p.id_periodo) === d.idPeriodo ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
      }
      const se = document.getElementById('sel-est');
      const cur = se.value || d.idEstudiante;
      se.innerHTML = '<option value="">-- Selecciona un estudiante --</option>' +
        d.estudiantes.map(e => `<option value="${e.id_estudiante}" ${String(e.id_estudiante) === String(cur) ? 'selected' : ''}>${esc(e.apellidos)} ${esc(e.nombres)}</option>`).join('');
      const sm = document.getElementById('sel-mat');
      if (d.materiasFiltro.length > 0) {
        document.getElementById('lbl-mat').style.display = 'block';
        sm.style.display = 'block';
        sm.innerHTML = '<option value="">-- Todas las materias --</option>' +
          d.materiasFiltro.map(m => `<option value="${m.id_materia}" ${String(m.id_materia) === d.idMateria ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('');
      } else { document.getElementById('lbl-mat').style.display = 'none'; sm.style.display = 'none'; }
      const div = document.getElementById('resultado');
      if (!d.idEstudiante) { div.innerHTML = ''; return; }
      if (d.mensajeSinNotas) { div.innerHTML = `<div class="alert alert-error">${esc(d.mensajeSinNotas)}</div>`; return; }
      const contador = (d.materiasTotales != null)
        ? `<div class="form-box"><p><small>Materias con notas: <strong>${d.materiasConNotas} de ${d.materiasTotales}</strong> (promedio general sobre las calificadas).</small></p></div>`
        : '';
      const headerMat = d.idMateria
        ? `<div class="form-box"><h2>Promedio en la materia seleccionada: ${d.promedioMateriaSel != null ? esc(d.promedioMateriaSel) + ' — ' + esc(d.escalaMateriaSel) : 'Sin calificar'}</h2><p><small>Aprueba con 7.00 o más.</small></p></div>`
        : '';
      div.innerHTML = contador + headerMat +
        d.materias.map((m, i) => {
          const filas = m.parciales.length > 0
            ? m.parciales.map(p => `<tr><td>${esc(p.tipo)}</td><td>${esc(p.valor)}</td></tr>`).join('')
            : `<tr><td colspan="2" style="color:#6b7280;">Sin notas registradas.</td></tr>`;
          const prom = m.sin_notas
            ? `<span class="mat-prom na">Sin calificar</span>`
            : `<span class="mat-prom">${esc(m.promedio)}</span>`;
          const esc_ = m.sin_notas
            ? `<span class="mat-escala na">pendiente</span>`
            : `<span class="mat-escala">${esc(m.escala)}</span>`;
          return `<div class="mat-card ${m.sin_notas ? 'sin-notas' : ''}">
            <div class="mat-top">
              <span class="mat-nombre">${esc(m.nombre)}</span>
              ${prom}${esc_}
              <button class="btn-secondary btn-sm" onclick="document.getElementById('mat-det-${i}').style.display = document.getElementById('mat-det-${i}').style.display === 'none' ? 'block' : 'none'">Ver notas</button>
            </div>
            <div class="mat-detalle" id="mat-det-${i}" style="display:none">
              <div class="table-responsive"><table><thead><tr><th>Tipo de evaluación</th><th>Nota</th></tr></thead>
              <tbody>${filas}</tbody></table></div>
            </div>
          </div>`;
        }).join('') +
        `<div class="form-box"><h2>Promedio general del periodo: ${esc(d.promedioGeneral)}</h2></div>`;
      await cargarDesglose(d);
    }
    async function cargarDesglose(d) {
      const div = document.getElementById('desglose');
      div.innerHTML = '';
      if (!d.idMateria || !d.idEstudiante) return;
      try {
        const g = await apiGet(`/consulta/materia/${d.idMateria}?id_estudiante=${d.idEstudiante}&id_periodo=${d.idPeriodo}`);
        if (!g.ciclos || g.ciclos.length === 0) return;
        div.innerHTML = `<div class="form-box"><h2>Desglose por ciclo y parcial</h2>
          <p><small>Mínimo esperado de insumos por parcial en esta materia: <strong>${g.minimo_insumos}</strong>.</small></p></div>` +
          g.ciclos.map(c => `<table><thead><tr><th colspan="4">${esc(c.nombre)} (peso anual ${esc(c.peso)} · formativa ${esc(c.peso_formativa)} / examen ${esc(c.peso_sumativa)})</th></tr>
            <tr><th>Parcial</th><th>Promedio</th><th>Escala</th><th>Insumos</th></tr></thead><tbody>` +
            c.parciales.map(p => `<tr><td>${esc(p.nombre)}</td>
              <td>${p.promedio != null ? esc(p.promedio) : '—'}</td><td>${esc(p.escala)}</td>
              <td>${p.n_insumos != null ? `${p.n_insumos}/${p.minimo}` + (p.faltan > 0 ? ` (faltan ${p.faltan})` : ' ✓') : '—'}</td></tr>`).join('') +
            `<tr><td><strong>Promedio del ciclo</strong></td><td><strong>${c.promedio != null ? esc(c.promedio) : '—'}</strong></td>
              <td colspan="2">${esc(c.escala)}</td></tr></tbody></table>`).join('');
      } catch (err) { showError(err.message); }
    }
    (async () => {
      if (!await initPage()) return;
      await cargar(true).catch(showError);
      document.getElementById('sel-periodo').onchange = async () => {
        const id = document.getElementById('sel-periodo').value;
        await apiPost('/auth/periodo-seleccionado', { id_periodo: Number(id) });
        location.reload();
      };
      document.getElementById('sel-est').onchange = () => cargar().catch(showError);
      document.getElementById('sel-mat').onchange = () => cargar().catch(showError);
    })();
  </script>
</body>
</html>
