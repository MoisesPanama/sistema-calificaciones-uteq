<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta - Sistema de Calificaciones</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .mat-card {
      background: white; border-radius: 12px; padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 0.9rem;
      border-left: 4px solid #2563eb;
    }
    .mat-card.sin-notas { border-left-color: #d1d5db; }
    .mat-top { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .mat-nombre { font-weight: 700; font-size: 1rem; color: #1f2937; flex: 1; min-width: 160px; }
    .mat-prom { font-size: 1.7rem; font-weight: 800; color: #1e3a8a; }
    .mat-prom.na { font-size: 1rem; font-weight: 600; color: #9ca3af; }
    .mat-escala { font-size: 0.78rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 6px; background: #eff6ff; color: #1e40af; }
    .mat-escala.na { background: #f3f4f6; color: #6b7280; }
    .mat-detalle { margin-top: 0.8rem; border-top: 1px solid #f3f4f6; padding-top: 0.8rem; }

    /* Desglose: cards por ciclo */
    .ciclo-card {
      background: white; border-radius: 12px; margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    .ciclo-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.2rem; cursor: pointer; user-select: none;
      background: linear-gradient(135deg, #1e3a8a, #3b5998);
      color: white; transition: opacity 0.15s;
    }
    .ciclo-header:hover { opacity: 0.92; }
    .ciclo-header-left { display: flex; align-items: center; gap: 0.8rem; flex: 1; }
    .ciclo-nombre { font-weight: 700; font-size: 0.95rem; }
    .ciclo-meta { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
    .ciclo-header-right { display: flex; align-items: center; gap: 0.7rem; }
    .ciclo-prom-badge {
      font-size: 1.3rem; font-weight: 800; background: rgba(255,255,255,0.2);
      padding: 0.3rem 0.8rem; border-radius: 8px;
    }
    .ciclo-escala-badge {
      font-size: 0.8rem; font-weight: 700; padding: 0.25rem 0.65rem;
      border-radius: 6px; background: rgba(255,255,255,0.25);
    }
    .ciclo-chevron {
      transition: transform 0.2s; font-size: 1.1rem;
    }
    .ciclo-card.abierto .ciclo-chevron { transform: rotate(180deg); }
    .ciclo-body {
      display: none; padding: 0;
    }
    .ciclo-card.abierto .ciclo-body { display: block; }

    /* Parcial row dentro del ciclo */
    .parcial-row {
      display: grid; grid-template-columns: 1fr 80px 60px 100px;
      align-items: center; padding: 0.65rem 1.2rem;
      border-bottom: 1px solid #f3f4f6; font-size: 0.88rem;
      transition: background 0.1s;
    }
    .parcial-row:last-child { border-bottom: none; }
    .parcial-row:hover { background: #f9fafb; }
    .parcial-nombre { font-weight: 600; color: #374151; }
    .parcial-prom { font-weight: 700; color: #1e3a8a; text-align: center; }
    .parcial-prom.vacio { color: #9ca3af; font-weight: 400; }
    .badge-escala {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: 5px; text-align: center;
    }
    .badge-AD { background: #dcfce7; color: #166534; }
    .badge-A  { background: #dbeafe; color: #1e40af; }
    .badge-AB { background: #fef3c7; color: #92400e; }
    .badge-B  { background: #fee2e2; color: #991b1b; }
    .badge-SN { background: #f3f4f6; color: #6b7280; }
    .parcial-ins { text-align: right; font-size: 0.78rem; }
    .ins-ok { color: #16a34a; font-weight: 600; }
    .ins-falta { color: #dc2626; }

    /* Promedio general al fondo */
    .prom-general-box {
      background: white; border-radius: 12px; padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex; align-items: center; gap: 1rem;
      border: 2px solid #1e3a8a; margin-top: 1.2rem;
    }
    .prom-general-label { font-size: 0.9rem; font-weight: 600; color: #374151; flex: 1; }
    .prom-general-valor { font-size: 1.8rem; font-weight: 800; color: #1e3a8a; }

    @media (max-width: 600px) {
      .parcial-row { grid-template-columns: 1fr 60px 50px 80px; font-size: 0.8rem; }
      .ciclo-header { flex-wrap: wrap; gap: 0.5rem; }
      .ciclo-prom-badge { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="layout">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="topbar-wrapper">
    <header class="topbar" id="app-topbar"></header>
    <main class="main-content">
    <h1>Consulta de Calificaciones</h1>
    <p class="periodo-fijo" id="info-periodo"></p>
    <p class="alert alert-error" id="error" style="display:none"></p>
    <div class="form-box">
      <label for="sel-periodo">Periodo</label>
      <select id="sel-periodo"></select>
    </div>

    <!-- Nivel 1: bloques Materia + Paralelo -->
    <div id="vista-bloques">
      <h2 style="font-size:1rem;color:#1e3a8a;margin-bottom:0.8rem;">Elige materia y paralelo</h2>
      <div class="cat-grid" id="grupos"></div>
    </div>

    <!-- Nivel 2: nomina paginada del bloque -->
    <div id="vista-grupo" style="display:none">
      <button class="btn-secondary" id="btn-grupos" style="margin-bottom:1rem;">&larr; Todos los grupos</button>
      <h2 id="grupo-titulo" style="font-size:1.05rem;color:#1e3a8a;margin-bottom:1rem;"></h2>
      <div id="nomina"></div>
      <div class="pagination" id="paginacion-nom"></div>
    </div>

    <!-- Nivel 3: detalle del estudiante -->
    <div id="vista-detalle" style="display:none">
      <button class="btn-secondary" id="btn-nomina" style="margin-bottom:1rem;">&larr; Volver a la nómina</button>
      <div id="resultado"></div>
      <div id="desglose"></div>
    </div>
    </main>
  </div>
</div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pagination.js"></script>
  <script>
    let periodoId = '';
    let grupo = null;
    let nomPage = 1;

    function mostrar(nivel) {
      document.getElementById('vista-bloques').style.display = nivel === 1 ? 'block' : 'none';
      document.getElementById('vista-grupo').style.display = nivel === 2 ? 'block' : 'none';
      document.getElementById('vista-detalle').style.display = nivel === 3 ? 'block' : 'none';
    }

    async function cargarPeriodos() {
      const per = await apiGet('/periodos/');
      const sel = document.getElementById('sel-periodo');
      sel.innerHTML = (per.periodos || []).map(p => `<option value="${p.id_periodo}">${esc(p.nombre)}</option>`).join('');
      periodoId = String(per.periodoActivo?.id_periodo || per.periodos?.[0]?.id_periodo || '');
      sel.value = periodoId;
      const nombre = (per.periodos || []).find(p => String(p.id_periodo) === periodoId)?.nombre || per.periodoActivo?.nombre || '—';
      document.getElementById('info-periodo').innerHTML = `Periodo seleccionado: <strong>${esc(nombre)}</strong>`;
    }

    async function cargarGrupos() {
      const d = await apiGet('/consulta/grupos?id_periodo=' + encodeURIComponent(periodoId));
      document.getElementById('info-periodo').innerHTML =
        `Periodo seleccionado: <strong>${esc(d.periodoNombre || '—')}</strong>`;
      const div = document.getElementById('grupos');
      if (!d.grupos || d.grupos.length === 0) {
        div.innerHTML = '<p>No hay grupos (materia＋paralelo) asignados en este periodo.</p>';
        return;
      }
      div.innerHTML = d.grupos.map((g, i) => `
        <div class="cat-card" data-grupo="${i}">
          <h3>${esc(g.materia)}</h3>
          <div class="total">${esc(g.curso || 'General')}${g.paralelo ? ' ' + esc(g.paralelo) : ''}</div>
          <div class="meta">${g.n_estudiantes} estudiante(s)</div>
        </div>`).join('');
      div.querySelectorAll('[data-grupo]').forEach(el => {
        el.onclick = () => entrarGrupo(d.grupos[Number(el.dataset.grupo)]);
      });
      mostrar(1);
    }

    function entrarGrupo(g) {
      grupo = g;
      nomPage = 1;
      document.getElementById('grupo-titulo').textContent =
        `${g.materia} — ${g.curso || 'General'}${g.paralelo ? ' ' + g.paralelo : ''}`;
      mostrar(2);
      cargarNomina().catch(showError);
    }

    async function cargarNomina() {
      const url = `/consulta/grupo?id_periodo=${encodeURIComponent(periodoId)}` +
        `&id_materia=${grupo.id_materia}&id_curso=${grupo.id_curso || ''}&page=${nomPage}&limit=10`;
      const d = await apiGet(url);
      const div = document.getElementById('nomina');
      if (!d.datos || d.datos.length === 0) {
        div.innerHTML = '<p>No hay estudiantes en este grupo.</p>';
        renderPaginacion('paginacion-nom', d.paginacion, () => {});
        return;
      }
      div.innerHTML = `<div class="table-responsive"><table><thead><tr>
        <th>Apellidos</th><th>Nombres</th><th>Curso</th><th></th></tr></thead><tbody>` +
        d.datos.map(e => `<tr><td>${esc(e.apellidos)}</td><td>${esc(e.nombres)}</td>
          <td>${e.curso ? esc(e.curso) + ' ' + esc(e.paralelo || '') : '—'}</td>
          <td class="td-actions"><button class="btn-secondary btn-sm" data-ver-est="${e.id_estudiante}">Ver notas</button></td>
        </tr>`).join('') + '</tbody></table></div>';
      renderPaginacion('paginacion-nom', d.paginacion, (p) => { nomPage = p; cargarNomina().catch(showError); });
      div.querySelectorAll('[data-ver-est]').forEach(b => b.onclick = () => verDetalle(b.dataset.verEst));
    }

    async function verDetalle(idEstudiante) {
      const d = await apiGet(`/consulta/?id_periodo=${encodeURIComponent(periodoId)}` +
        `&id_estudiante=${idEstudiante}&id_materia=${grupo.id_materia}`);
      await renderDetalle(d);
      mostrar(3);
      window.scrollTo(0, 0);
    }

    async function renderDetalle(d) {
      const div = document.getElementById('resultado');
      if (d.mensajeSinNotas) { div.innerHTML = `<div class="alert alert-error">${esc(d.mensajeSinNotas)}</div>`; return; }
      const contador = (d.materiasTotales != null)
        ? `<div class="form-box"><p><small>Materias con notas: <strong>${d.materiasConNotas} de ${d.materiasTotales}</strong> (promedio general sobre las calificadas).</small></p></div>`
        : '';
      const headerMat =
        `<div class="form-box"><h2>${esc(d.materia?.nombre || grupo.materia)}: ${d.promedioMateriaSel != null ? esc(d.promedioMateriaSel) + ' — ' + esc(d.escalaMateriaSel) : 'Sin calificar'}</h2><p><small>Aprueba con 7.00 o mas.</small></p></div>`;
      const soloEsta = (d.materias || []).filter(m => String(m.id_materia) === String(grupo.id_materia));
      const lista = soloEsta.length > 0 ? soloEsta : d.materias;
      div.innerHTML = contador + headerMat +
        lista.map((m, i) => {
          const filas = m.parciales.length > 0
            ? m.parciales.map(p => `<tr><td>${esc(p.tipo)}</td><td>${esc(p.valor)}</td></tr>`).join('')
            : `<tr><td colspan="2" style="color:#6b7280;">Sin notas registradas.</td></tr>`;
          const prom = m.sin_notas
            ? `<span class="mat-prom na">Sin calificar</span>`
            : `<span class="mat-prom">${esc(m.promedio)}</span>`;
          const esc_ = m.sin_notas
            ? `<span class="mat-escala na">pendiente</span>`
            : `<span class="mat-escala">${esc(m.escala)}</span>`;
          return `<div class="mat-card ${m.sin_notas ? 'sin-notas' : ''}">
            <div class="mat-top">
              <span class="mat-nombre">${esc(m.nombre)}</span>
              ${prom}${esc_}
              <button class="btn-secondary btn-sm" onclick="document.getElementById('mat-det-${i}').style.display = document.getElementById('mat-det-${i}').style.display === 'none' ? 'block' : 'none'">Ver notas</button>
            </div>
            <div class="mat-detalle" id="mat-det-${i}" style="display:none">
              <div class="table-responsive"><table><thead><tr><th>Tipo de evaluacion</th><th>Nota</th></tr></thead>
              <tbody>${filas}</tbody></table></div>
            </div>
          </div>`;
        }).join('');
      const promGeneralBox = d.promedioGeneral != null
        ? `<div class="prom-general-box">
            <span class="prom-general-label">Promedio general del periodo</span>
            <span class="prom-general-valor">${esc(d.promedioGeneral)}</span>
          </div>`
        : '';
      div.innerHTML += promGeneralBox;
      await cargarDesglose({ idMateria: grupo.id_materia, idEstudiante: d.idEstudiante, idPeriodo: d.idPeriodo });
    }

    function badgeEscala(escala) {
      const e = (escala || 'S/N').toUpperCase();
      const cls = e === 'AD' ? 'badge-AD' : e === 'A' ? 'badge-A' : e === 'AB' ? 'badge-AB' : e === 'B' ? 'badge-B' : 'badge-SN';
      return `<span class="badge-escala ${cls}">${e}</span>`;
    }

    async function cargarDesglose(d) {
      const div = document.getElementById('desglose');
      div.innerHTML = '';
      if (!d.idMateria || !d.idEstudiante) return;
      try {
        const g = await apiGet(`/consulta/materia/${d.idMateria}?id_estudiante=${d.idEstudiante}&id_periodo=${d.idPeriodo}`);
        if (!g.ciclos || g.ciclos.length === 0) return;

        div.innerHTML = `<h3 style="font-size:1rem;color:#1e3a8a;margin:1.2rem 0 0.6rem;">Desglose por ciclo y parcial</h3>
          <p style="font-size:0.8rem;color:#6b7280;margin-bottom:0.8rem;">Minimo esperado de insumos por parcial: <strong>${g.minimo_insumos}</strong>.</p>` +
          g.ciclos.map((c, ci) => {
            const promStr = c.promedio != null ? esc(c.promedio) : '—';
            const escalaStr = c.escala || 'S/N';
            const abierto = ci === 0 ? ' abierto' : '';
            const parciales = c.parciales.map(p => {
              const insHtml = p.n_insumos != null
                ? (p.faltan > 0
                  ? `<span class="ins-falta">${p.n_insumos}/${p.minimo} (faltan ${p.faltan})</span>`
                  : `<span class="ins-ok">${p.n_insumos}/${p.minimo} &#10003;</span>`)
                : '<span style="color:#9ca3af;">—</span>';
              return `<div class="parcial-row">
                <span class="parcial-nombre">${esc(p.nombre)}</span>
                <span class="parcial-prom${p.promedio == null ? ' vacio' : ''}">${p.promedio != null ? esc(p.promedio) : '—'}</span>
                <span>${badgeEscala(p.escala)}</span>
                <span class="parcial-ins">${insHtml}</span>
              </div>`;
            }).join('');

            return `<div class="ciclo-card${abierto}" id="ciclo-${ci}">
              <div class="ciclo-header" onclick="document.getElementById('ciclo-${ci}').classList.toggle('abierto')">
                <div class="ciclo-header-left">
                  <div>
                    <div class="ciclo-nombre">${esc(c.nombre)}</div>
                    <div class="ciclo-meta">Peso anual ${esc(c.peso)} &middot; Formativa ${esc(c.peso_formativa)} / Examen ${esc(c.peso_sumativa)}</div>
                  </div>
                </div>
                <div class="ciclo-header-right">
                  <span class="ciclo-prom-badge">${promStr}</span>
                  <span class="ciclo-escala-badge">${badgeEscala(escalaStr)}</span>
                  <span class="ciclo-chevron">&#9660;</span>
                </div>
              </div>
              <div class="ciclo-body">
                <div class="parcial-row" style="background:#f8f9fb;font-weight:700;color:#6b7280;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.03em;">
                  <span>Parcial</span><span style="text-align:center;">Promedio</span><span>Escala</span><span style="text-align:right;">Insumos</span>
                </div>
                ${parciales}
              </div>
            </div>`;
          }).join('');
      } catch (err) { showError(err.message); }
    }

    async function verDetallePropio() {
      const d = await apiGet(`/consulta/?id_periodo=${encodeURIComponent(periodoId)}`);
      if (d.mensajeSinNotas) {
        document.getElementById('resultado').innerHTML = `<div class="alert alert-error">${esc(d.mensajeSinNotas)}</div>`;
        mostrar(3);
        return;
      }
      renderDetalleDirecto(d);
      mostrar(3);
    }

    function renderDetalleDirecto(d) {
      const div = document.getElementById('resultado');
      if (d.mensajeSinNotas) { div.innerHTML = `<div class="alert alert-error">${esc(d.mensajeSinNotas)}</div>`; return; }
      const contador = (d.materiasTotales != null)
        ? `<div class="form-box"><p><small>Materias con notas: <strong>${d.materiasConNotas} de ${d.materiasTotales}</strong> (promedio general sobre las calificadas).</small></p></div>`
        : '';
      const lista = d.materias || [];
      div.innerHTML = contador +
        lista.map((m, i) => {
          const filas = m.parciales.length > 0
            ? m.parciales.map(p => `<tr><td>${esc(p.tipo)}</td><td>${esc(p.valor)}</td></tr>`).join('')
            : `<tr><td colspan="2" style="color:#6b7280;">Sin notas registradas.</td></tr>`;
          const prom = m.sin_notas
            ? `<span class="mat-prom na">Sin calificar</span>`
            : `<span class="mat-prom">${esc(m.promedio)}</span>`;
          const esc_ = m.sin_notas
            ? `<span class="mat-escala na">pendiente</span>`
            : `<span class="mat-escala">${esc(m.escala)}</span>`;
          return `<div class="mat-card ${m.sin_notas ? 'sin-notas' : ''}">
            <div class="mat-top">
              <span class="mat-nombre">${esc(m.nombre)}</span>
              ${prom}${esc_}
              <button class="btn-secondary btn-sm" onclick="document.getElementById('mat-det-${i}').style.display = document.getElementById('mat-det-${i}').style.display === 'none' ? 'block' : 'none'">Ver notas</button>
            </div>
            <div class="mat-detalle" id="mat-det-${i}" style="display:none">
              <div class="table-responsive"><table><thead><tr><th>Tipo de evaluacion</th><th>Nota</th></tr></thead>
              <tbody>${filas}</tbody></table></div>
            </div>
          </div>`;
        }).join('');
      const promGeneralBox = d.promedioGeneral != null
        ? `<div class="prom-general-box">
            <span class="prom-general-label">Promedio general del periodo</span>
            <span class="prom-general-valor">${esc(d.promedioGeneral)}</span>
          </div>`
        : '';
      div.innerHTML += promGeneralBox;
    }

    (async () => {
      const usuario = await initPage();
      if (!usuario) return;
      const esEstudiante = usuario.nombre_rol === 'estudiante';
      document.getElementById('btn-grupos').onclick = () => cargarGrupos().catch(showError);
      document.getElementById('btn-nomina').onclick = () => mostrar(2);
      try {
        await cargarPeriodos();
        if (esEstudiante) {
          await verDetallePropio();
        } else {
          await cargarGrupos();
        }
      } catch (err) { showError(err.message); }
      document.getElementById('sel-periodo').onchange = async () => {
        const id = document.getElementById('sel-periodo').value;
        await apiPost('/auth/periodo-seleccionado', { id_periodo: Number(id) });
        location.reload();
      };
    })();
  </script>
</body>
</html>
