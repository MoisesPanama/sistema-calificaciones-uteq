<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preinscripción - Sistema de Calificaciones</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
  <div class="login-box" style="max-width:560px;">
    <h1>Preinscripción</h1>
    <h2>Completa los datos; el colegio revisará tu solicitud</h2>
    <p class="alert alert-error" id="error" style="display:none"></p>
    <p class="alert-exito" id="ok" style="display:none"></p>
    <div id="formulario">
      <div class="wizard-pasos">
        <span id="paso-t1" class="activo">1. Estudiante</span>
        <span id="paso-t2">2. Acudiente</span>
        <span id="paso-t3">3. Curso y envío</span>
      </div>
      <div class="wizard-panel activo" id="paso-1">
        <label for="nombres">Nombres del aspirante</label>
        <input type="text" id="nombres" required>
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" required>
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" required>
        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" required>
        <label for="grupo_sanguineo">Tipo de sangre (opcional)</label>
        <select id="grupo_sanguineo">
          <option value="">-- No indica --</option>
          <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
        </select>
        <label for="discapacidad">Discapacidad o condición (opcional)</label>
        <input type="text" id="discapacidad" placeholder="Ej. ninguna">
        <label for="contacto_emergencia">Contacto de emergencia (opcional)</label>
        <input type="text" id="contacto_emergencia" placeholder="Nombre">
        <label for="tel_emergencia">Teléfono de emergencia (opcional)</label>
        <input type="text" id="tel_emergencia">
        <div class="form-actions"><button class="btn-primary" id="sig1">Siguiente</button></div>
      </div>
      <div class="wizard-panel" id="paso-2">
        <label for="rep_nombres">Nombres del acudiente</label>
        <input type="text" id="rep_nombres" required>
        <label for="rep_apellidos">Apellidos del acudiente</label>
        <input type="text" id="rep_apellidos" required>
        <label for="rep_telefono">Teléfono</label>
        <input type="text" id="rep_telefono">
        <label for="rep_email">Email</label>
        <input type="email" id="rep-email" placeholder="avisa el resultado">
        <label for="rep_parentesco">Parentesco con el aspirante</label>
        <select id="rep_parentesco" required>
          <option value="">-- Selecciona --</option>
          <option value="padre">Padre</option>
          <option value="madre">Madre</option>
          <option value="representante legal">Representante legal</option>
          <option value="otro familiar">Otro familiar</option>
        </select>
        <label for="rep_documento">Documento del acudiente (cédula)</label>
        <input type="text" id="rep_documento" required>
        <div class="form-actions">
          <button class="btn-secondary" id="ant2">Atrás</button>
          <button class="btn-primary" id="sig2">Siguiente</button>
        </div>
      </div>
      <div class="wizard-panel" id="paso-3">
        <p id="aviso-tipo" style="font-size:0.85rem;color:#1e3a8a;font-weight:600;"></p>
        <p id="aviso-ventana" class="alert alert-error" style="display:none"></p>
        <label for="sel-periodo">Periodo</label>
        <select id="sel-periodo"></select>
        <label for="sel-curso">Curso (solo con cupo y de tu nivel)</label>
        <select id="sel-curso" required></select>
        <label for="documento">Documento PDF (obligatorio)</label>
        <input type="file" id="documento" accept=".pdf" required>
        <div class="form-actions">
          <button class="btn-secondary" id="ant3">Atrás</button>
          <button class="btn-primary" id="enviar">Enviar solicitud</button>
        </div>
      </div>
    </div>
    <p style="margin-top:1rem;font-size:0.85rem;"><a href="login.html">Volver al inicio de sesión</a></p>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    function irPaso(n) {
      [1, 2, 3].forEach(i => {
        document.getElementById('paso-' + i).classList.toggle('activo', i === n || (n === 4));
        document.getElementById('paso-t' + i).classList.toggle('activo', i <= n);
      });
      if (n === 4) document.getElementById('formulario').style.display = 'none';
    }
    function req(id, nombre) {
      const v = document.getElementById(id).value.trim();
      if (!v) { showError('Falta: ' + nombre + '.'); return null; }
      return v;
    }
    (async () => {
      let elegiblesCache = [];
      async function cargarOpciones() {
        const ced = document.getElementById('cedula').value.trim();
        const per = document.getElementById('sel-periodo').value;
        let url = '/preinscripciones/opciones';
        const qs = [];
        if (ced) qs.push('cedula=' + encodeURIComponent(ced));
        if (per) qs.push('id_periodo=' + encodeURIComponent(per));
        if (qs.length > 0) url += '?' + qs.join('&');
        const d = await apiGet(url);
        document.getElementById('sel-periodo').innerHTML =
          (d.periodos || []).map(p => `<option value="${p.id_periodo}" ${String(p.id_periodo) === String(d.periodoActivo?.id_periodo) || String(p.id_periodo) === String(per) ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
        elegiblesCache = d.elegibles || [];
        const av = document.getElementById('aviso-ventana');
        if (!d.matricula_abierta) {
          av.textContent = 'El periodo de matriculación está cerrado en este momento. No se puede enviar la solicitud.';
          av.style.display = 'block';
        } else { av.style.display = 'none'; }
        const at = document.getElementById('aviso-tipo');
        at.textContent = d.tipo === 'rematricula'
          ? 'Detectamos tu cédula: es rematrícula (subes de nivel o repites según tus notas).'
          : 'Solicitud nueva: solo verás cursos iniciales con cupo disponible.';
        document.getElementById('sel-curso').innerHTML =
          elegiblesCache.map(x => `<option value="${x.id_curso}">${esc(x.nombre)} ${esc(x.paralelo || '')} — ${x.disponibles} cupo(s)</option>`).join('')
          || '<option value="">Sin cupos disponibles en tu nivel</option>';
      }
      try {
        await cargarOpciones();
        document.getElementById('sel-periodo').onchange = () => cargarOpciones().catch(showError);
      } catch (err) { showError(err.message); return; }

      document.getElementById('sig1').onclick = async () => {
        if (!req('nombres', 'nombres') || !req('apellidos', 'apellidos') ||
            !req('cedula', 'cédula') || !req('fecha_nacimiento', 'fecha')) return;
        try { await cargarOpciones(); } catch (err) { showError(err.message); return; }
        irPaso(2);
      };
      document.getElementById('ant2').onclick = () => irPaso(1);
        document.getElementById('sig2').onclick = () => {
          if (!req('rep_nombres', 'nombres del acudiente') || !req('rep_apellidos', 'apellidos del acudiente')) return;
          if (!document.getElementById('rep_parentesco').value) { showError('Falta: parentesco del acudiente.'); return; }
          if (!req('rep_documento', 'documento del acudiente')) return;
          irPaso(3);
        };
      document.getElementById('ant3').onclick = () => irPaso(2);
      document.getElementById('enviar').onclick = async () => {
        try {
          const fd = new FormData();
          ['nombres', 'apellidos', 'cedula', 'fecha_nacimiento', 'rep_nombres', 'rep_apellidos'].forEach(k =>
            fd.append(k, document.getElementById(k).value));
          fd.append('rep_telefono', document.getElementById('rep_telefono').value);
          fd.append('rep_email', document.getElementById('rep-email').value);
          fd.append('rep_parentesco', document.getElementById('rep_parentesco').value);
          fd.append('rep_documento', document.getElementById('rep_documento').value);
          fd.append('grupo_sanguineo', document.getElementById('grupo_sanguineo').value);
          fd.append('discapacidad', document.getElementById('discapacidad').value);
          fd.append('contacto_emergencia', document.getElementById('contacto_emergencia').value);
          fd.append('tel_emergencia', document.getElementById('tel_emergencia').value);
          fd.append('id_periodo', document.getElementById('sel-periodo').value);
          const idCurso = document.getElementById('sel-curso').value;
          if (!idCurso) { showError('No hay cupos disponibles en tu nivel para este periodo.'); return; }
          fd.append('id_curso', idCurso);
          const f = document.getElementById('documento').files[0];
          if (f) fd.append('documento', f);
          const res = await fetch('/api/preinscripciones/', { method: 'POST', body: fd });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
          document.getElementById('ok').textContent = data.mensaje + ' (N.º ' + data.id_solicitud + ')';
          document.getElementById('ok').style.display = 'block';
          irPaso(4);
        } catch (err) { showError(err.message); }
      };
    })();
  </script>
</body>
</html>
