services:
  db:
    image: postgres:18-alpine
    container_name: uteq-db
    environment:
      POSTGRES_DB: calificaciones_uteq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-uteq-root-2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - uteq-db-data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./database:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: uteq-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: calificaciones_uteq
      DB_USER: app_uteq
      DB_PASSWORD: ${DB_PASSWORD:-UTEQ2026}
      SESSION_SECRET: ${SESSION_SECRET:-uteq-docker-session-2026}
      FRONTEND_URL: "*"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  uteq-db-data:
